[agent]
  interval = "10s"
  flush_interval = "10s"
  omit_hostname = false

[[outputs.prometheus_client]]
  listen = ":9273"
  metric_version = 2

[[inputs.docker]]
  # Pointing to the secure Socket Proxy container
  endpoint = "tcp://docker-socket-proxy:2375"
  gather_services = false
  timeout = "5s"